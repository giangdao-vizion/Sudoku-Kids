<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1FA8A0" />
  <title>Sudoku Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-bg" aria-hidden="true"></div>

  <main class="app" id="app">
    <!-- HOME -->
    <section class="screen screen--home" id="screen-home" aria-label="Trang chủ">
      <header class="home-hero">
        <p class="brand-mark" aria-hidden="true">★</p>
        <h1 class="brand">Sudoku Kids</h1>
        <p class="tagline">Chơi số vui nhộn cho bé 3–7 tuổi</p>
      </header>

      <div class="home-panel">
        <h2 class="panel-title">Chọn bảng chơi</h2>
        <div class="size-grid" role="list">
          <button class="size-card" data-size="2x2" type="button">
            <span class="size-card__preview size-card__preview--grid2" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </span>
            <span class="size-card__label">2 × 2</span>
          </button>
          <button class="size-card" data-size="3x3" type="button">
            <span class="size-card__preview size-card__preview--grid3" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </span>
            <span class="size-card__label">3 × 3</span>
          </button>
          <button class="size-card" data-size="4x4" type="button">
            <span class="size-card__preview size-card__preview--grid4" aria-hidden="true"></span>
            <span class="size-card__label">4 × 4</span>
          </button>
          <button class="size-card" data-size="6x6" type="button">
            <span class="size-card__preview size-card__preview--grid6" aria-hidden="true"></span>
            <span class="size-card__label">6 × 6</span>
          </button>
          <button class="size-card size-card--wide" data-size="9x9" type="button">
            <span class="size-card__preview size-card__preview--grid9" aria-hidden="true"></span>
            <span class="size-card__label">9 × 9</span>
          </button>
        </div>

        <div class="difficulty-block is-hidden" id="difficulty-block">
          <h2 class="panel-title">Chọn độ khó</h2>
          <div class="diff-row" role="group" aria-label="Độ khó">
            <button class="diff-btn" data-diff="easy" type="button">Easy</button>
            <button class="diff-btn" data-diff="medium" type="button">Medium</button>
            <button class="diff-btn" data-diff="hard" type="button">Hard</button>
          </div>
        </div>

        <button class="btn btn--primary btn--play is-hidden" id="btn-start" type="button">
          Bắt đầu chơi!
        </button>
      </div>
    </section>

    <!-- GAME -->
    <section class="screen screen--game is-hidden" id="screen-game" aria-label="Màn chơi">
      <header class="game-bar">
        <button class="btn btn--ghost" id="btn-home" type="button" aria-label="Về trang chủ">← Home</button>
        <div class="game-meta">
          <span class="pill" id="meta-size">4×4</span>
          <span class="pill pill--soft is-hidden" id="meta-diff">Easy</span>
        </div>
        <button class="btn btn--hint" id="btn-hint" type="button">💡 Gợi ý</button>
      </header>

      <p class="game-tip" id="game-tip">Chạm vào ô trống, rồi chọn số nhé!</p>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Bảng Sudoku"></div>
      </div>

      <div class="picker is-hidden" id="picker" aria-label="Chọn số">
        <div class="picker__head">
          <span class="picker__title">Chọn một số</span>
          <button class="btn btn--tiny" id="btn-erase" type="button">Xóa</button>
        </div>
        <div class="picker__nums" id="picker-nums"></div>
      </div>
    </section>

    <!-- WIN -->
    <div class="modal is-hidden" id="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="modal__card">
        <div class="modal__burst" aria-hidden="true">🎉</div>
        <h2 id="win-title">Giỏi quá!</h2>
        <p>Bé đã hoàn thành bảng Sudoku!</p>
        <div class="modal__actions">
          <button class="btn btn--primary" id="btn-again" type="button">Chơi lại</button>
          <button class="btn btn--ghost" id="btn-win-home" type="button">Về Home</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
